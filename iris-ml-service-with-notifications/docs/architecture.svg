<text x="1018" y="92" class="t">Cloud Run: iris-trainer</text><text x="1018" y="110" class="s">privato, lo chiama solo Eventarc</text>
<text x="968" y="148" class="f">• legge il CSV dal bucket</text>
<text x="968" y="170" class="f">• addestra il modello (SVM)</text>
<text x="968" y="192" class="f">• salva models/model-&lt;generation&gt;.pkl</text>
<text x="968" y="214" class="f">• ignora duplicati e file non CSV in data/</text>
<text x="968" y="236" class="f">• imposta MODEL_URI sul servizio API</text>
